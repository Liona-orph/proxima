# The gate. These jobs are the same steps, in the same order, as `make ci`.
# If you change one, change the other.
name: ci

on:
  push:
    branches: [main]
  pull_request:

# Read-only. Nothing here comments, labels, pushes or publishes.
permissions:
  contents: read

# One run per ref. A second push supersedes the first rather than queueing
# behind it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Warnings are errors everywhere, not only in the clippy job.
  RUSTFLAGS: -D warnings
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    # Defends: the diff is about the change, not about whitespace.
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The toolchain is pinned by rust-toolchain.toml, so rustup picks 1.83.0
      # on its own. A setup-toolchain action would mean writing the version a
      # second time, in a second place, where it can drift from the first.
      - name: Install toolchain
        run: |
          rustup toolchain install --profile minimal --component rustfmt 1.83.0
          rustc -Vv && cargo fmt --version
      - run: cargo fmt --all --check

  clippy:
    # Defends: the house rules that are lints — no unsafe, no unwrap outside
    # tests, docs on every public item, pedantic.
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install toolchain
        run: |
          rustup toolchain install --profile minimal --component clippy 1.83.0
          cargo clippy --version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: clippy
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    # Defends: correctness, including the determinism and recall properties.
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install toolchain
        run: rustup toolchain install --profile minimal 1.83.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: test
      - run: cargo test --workspace

  doc:
    # Defends: the docs build, and a broken intra-doc link fails rather than
    # rotting quietly.
    name: doc
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install toolchain
        run: rustup toolchain install --profile minimal 1.83.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: doc
      - run: cargo doc --workspace --no-deps --document-private-items

  bench:
    # Defends: the benchmarks still compile. They are not built by `cargo test`,
    # so without this they break silently and you find out the day you need to
    # re-measure a number in the docs. Compile only — a shared runner cannot
    # produce a latency worth publishing.
    name: bench (compile only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install toolchain
        run: rustup toolchain install --profile minimal 1.83.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: bench
      - run: cargo bench --workspace --no-run
