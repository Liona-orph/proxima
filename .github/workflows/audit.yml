# Supply chain. Two questions: is anything we depend on known to be broken, and
# is the dependency list still as short as we say it is.
name: audit

on:
  schedule:
    # Mondays, 06:17 UTC. Off the hour on purpose: the top of the hour is when
    # everybody else's cron runs and the runners queue.
    - cron: "17 6 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - ".github/workflows/audit.yml"
      - "deny.toml"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Pinned like everything else. Bumping this is a deliberate PR, not a drift.
  CARGO_DENY_VERSION: "0.16.2"

jobs:
  deny:
    # Defends: known advisories, licence compatibility, and duplicate versions
    # of the same crate sneaking into the lockfile.
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # rust-toolchain.toml already pins the toolchain, so rustup resolves it
      # without a third-party action naming the version a second time.
      - name: Install toolchain
        run: rustup toolchain install --profile minimal 1.83.0

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: audit

      - name: Install cargo-deny
        run: cargo install cargo-deny --version "${CARGO_DENY_VERSION}" --locked

      # `advisories` is the security check. `bans` catches duplicate versions,
      # `licenses` catches a dependency that is not Apache-2.0 compatible, and
      # `sources` catches anything not from crates.io. Configuration lives in
      # deny.toml if one is present; without it cargo-deny uses its defaults,
      # which is already the check we want for a four-dependency workspace.
      - name: cargo deny check
        run: cargo deny check advisories bans licenses sources

  dependency-count:
    # Defends: the dependency policy, mechanically. The workspace has four
    # runtime dependencies (thiserror, rand, rand_chacha, signal-hook) which
    # pull in 17 crates in total. This job does not judge whether a new
    # dependency is a good idea — that is what the justification paragraph in
    # the workspace Cargo.toml and a human reviewer are for. It just makes the
    # list growing impossible to miss.
    name: dependency count
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install toolchain
        run: rustup toolchain install --profile minimal 1.83.0

      - name: Count runtime dependencies
        env:
          # Raise this deliberately, in the same PR that adds the dependency
          # and the paragraph in Cargo.toml explaining it.
          EXPECTED: "17"
        run: |
          set -euo pipefail
          cargo tree --workspace --edges normal --prefix none --no-dedupe \
            | awk 'NF {print $1}' \
            | grep -v '^proxima-' \
            | sort -u > /tmp/runtime-deps.txt
          count=$(wc -l < /tmp/runtime-deps.txt | tr -d ' ')
          echo "Runtime dependencies (transitive, excluding workspace crates): ${count}"
          cat /tmp/runtime-deps.txt
          if [ "${count}" -gt "${EXPECTED}" ]; then
            echo "::error::Runtime dependency count grew from ${EXPECTED} to ${count}."
            echo "::error::Adding a dependency needs a justifying paragraph in the workspace Cargo.toml (see CONTRIBUTING.md), and this EXPECTED value raised in the same PR."
            exit 1
          fi
          if [ "${count}" -lt "${EXPECTED}" ]; then
            echo "::notice::Runtime dependency count dropped to ${count}. Lower EXPECTED so the ratchet keeps holding."
          fi
